services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sports-stats-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    restart: unless-stopped
    volumes:
      - mssql_data:/var/opt/mssql
volumes:
  mssql_data:
